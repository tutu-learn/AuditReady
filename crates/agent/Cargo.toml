[package]
name = "auditready"
version = "0.1.2"
edition = "2021"
description = "Cross-platform tool that lists all installed software on Windows and macOS"

[[bin]]
name = "auditready"
path = "src/main.rs"

[dependencies]
anyhow = "1"
auditready-protocol = { path = "../protocol" }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
portable-pty = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Client-mode tray icon + stats dashboard + connection-lost popup. Windows and
# macOS only, matching where client mode's clipboard/mouse monitoring already
# works (see crates/agent/src/client/clipboard, client/mouse). tray-icon/muda
# pull in GTK + libappindicator + libxdo on Linux, which don't build against
# the static-musl target the Linux release uses — see client/ui.rs's doc
# comment. Keeping these out of the Linux dependency graph entirely avoids
# that instead of trying to make it link.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
iced = { version = "0.14.0", features = ["tokio", "advanced"] }
tray-icon = "0.24.2"
muda = "0.19.3"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]}

# Client-mode clipboard monitoring on macOS uses AppKit (NSPasteboard,
# NSWorkspace frontmost app, NSEvent global key monitor).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "block2",
    "NSPasteboard",
    "NSWorkspace",
    "NSRunningApplication",
    "NSEvent",
]}
objc2-foundation = { version = "0.2", features = ["NSString", "NSRunLoop"] }

# Static musl builds need OpenSSL compiled from source (no system libssl).
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
